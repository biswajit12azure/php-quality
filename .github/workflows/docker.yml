name: Docker Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout Code
      # ============================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================
      # 2. Setup Docker Buildx
      # ============================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================
      # 3. Build Docker Image
      # ============================================

      - name: Build Docker Image
        run: |
          docker build \
            -t php-quality-training:${{ github.sha }} \
            .


      # ============================================
      # 4. Verify Docker Image
      # ============================================

      - name: Verify Docker Image
        run: |
          docker images

          docker image inspect \
            php-quality-training:${{ github.sha }}


      # ============================================
      # 5. Scan Docker Image with Trivy
      # ============================================

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: php-quality-training:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'


      # ============================================
      # 6. Run Docker Container
      # ============================================

      - name: Run Docker Container
        run: |
          docker run -d \
            --name php-quality-training \
            -p 8080:80 \
            php-quality-training:${{ github.sha }}


      # ============================================
      # 7. Check Container Status
      # ============================================

      - name: Check Container Status
        run: |
          docker ps -a

          docker inspect \
            php-quality-training


      # ============================================
      # 8. Wait for Application
      # ============================================

      - name: Wait for Application
        run: |
          echo "Waiting for PHP application..."

          for i in {1..30}; do

            if curl --silent --fail \
              http://127.0.0.1:8080 > /dev/null; then

              echo "Application is UP"
              exit 0

            fi

            echo "Attempt $i: Application not ready..."
            sleep 2

          done

          echo "Application failed to start"

          echo "=== Container Logs ==="
          docker logs php-quality-training

          exit 1


      # ============================================
      # 9. Docker Smoke Test
      # ============================================

      - name: Docker Smoke Test
        run: |
          HTTP_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            http://127.0.0.1:8080)

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && \
             [ "$HTTP_STATUS" -lt 400 ]; then

            echo "Docker smoke test PASSED"

          else

            echo "Docker smoke test FAILED"

            docker logs php-quality-training

            exit 1

          fi


      # ============================================
      # 10. Show Container Logs
      # ============================================

      - name: Container Logs
        if: always()
        run: |
          docker logs php-quality-training || true


      # ============================================
      # 11. Cleanup
      # ============================================

      - name: Cleanup Container
        if: always()
        run: |
          docker stop php-quality-training || true
          docker rm php-quality-training || true
