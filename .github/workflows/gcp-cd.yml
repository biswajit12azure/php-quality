name: Deploy PHP Application to GCP

on:
  workflow_run:
    workflows:
      - PHP Quality Pipeline
    types:
      - completed
    branches:
      - main

jobs:

  deploy:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout successful commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'


      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader


      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='coverage-html' \
            --exclude='coverage.xml' \
            -czf php-application.tar.gz .


      - name: Copy application to GCP VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "php-application.tar.gz"
          target: "/tmp"


      - name: Deploy application on GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

          script: |

            sudo mkdir -p /var/www/php-app

            sudo rm -rf /var/www/php-app/*

            sudo tar \
              -xzf /tmp/php-application.tar.gz \
              -C /var/www/php-app

            sudo chown -R www-data:www-data \
              /var/www/php-app

            sudo systemctl restart apache2